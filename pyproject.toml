[project]
name = "transformer"
version = "0.1.0"
description = "transformer project for 12 ml projects book"
authors = [
    {name = "Lawrence Borst",email = "laurens.s.borst@gmail.com"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "torch (>=2.14.0,<3.0.0)",
    "nltk (>=3.10.3,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "click (>=8.5.0,<9.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "mlflow (>=3.16.1,<4.0.0)",
    "huggingface-hub (>=2.1.1,<3.0.0)"
]


[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 88
target-version = ["py313"]


[tool.isort]
profile="black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "tests", "experiments"]
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "optuna-dashboard (>=0.21.0,<0.22.0)"
]
