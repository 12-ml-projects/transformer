[tox]
requires =
    tox>=4
env_list = py313, lint, format, typecheck
skip_missing_interpreters = true

[testenv]
description = run unit tests
skip_install = true
deps =
    torch>=2.14.0,<3.0.0
    nltk
    numpy
    pytest
    pytest-randomly
commands =
    pytest --strict-markers

[testenv:lint]
description = Lint using flake8
skip_install = true
deps =
    flake8
commands =
    flake8

[testenv:format]
description = Check formatting using black, isort, autoflake
skip_install = true
deps =
    black
    isort
    autoflake
commands =
    black --check .
    isort --check-only .
    autoflake --check --recursive src tests experiments

[testenv:typecheck]
description = Type-check using mypy
skip_install = true
deps =
    mypy
    torch>=2.14.0,<3.0.0
    nltk
    numpy
    pytest
    mlflow
    optuna
commands =
    mypy src tests experiments