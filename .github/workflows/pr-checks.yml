name: Pull Request Checks

on:
- pull_request
- merge_group

concurrency:
  # Only allow one run at a time of this workflow per PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Pull CPU-only torch wheels instead of the multi-GB CUDA build.
  # tox passes PIP_* variables through to its environments.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: tox.ini
    - name: Install tox
      run: python -m pip install tox
    - name: Run linting checks
      run: tox -e lint
    - name: Run formatting checks
      run: tox -e format
    - name: Run type checks
      run: tox -e typecheck

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python:
        - version: "3.13"
          toxenv: "py313"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python.version }}
        cache: pip
        cache-dependency-path: tox.ini
    - name: Install tox
      run: python -m pip install tox
    - name: Run pytest
      run: tox -e ${{ matrix.python.toxenv }} -- --randomly-seed=$RANDOM
